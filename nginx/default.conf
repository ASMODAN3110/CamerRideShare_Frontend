# Modèle nginx : ${API_UPSTREAM} (adresse interne de l'API, ex. http://camerrideshare-api:3000) est remplacée au démarrage du conteneur.
server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # PWA : ces fichiers ne doivent jamais rester en cache, sinon une nouvelle version n'est détectée qu'avec retard.
  # (no-cache = le navigateur revalide à chaque fois, et ne retélécharge que s'il a changé.)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }
  # Fichiers générés par le build : leur nom change à chaque version, ils se conservent donc un an.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /foo -> /index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Images envoyées (avatars, photos de véhicules, preuves) : servies par l'API, qui les lit dans le stockage (Garage).
  # Sans ce bloc, /uploads/... retombe sur le fallback SPA ci-dessus et renvoie index.html à la place de l'image.
  location /uploads/ {
    resolver 127.0.0.11 valid=30s;
    set $uploads_url ${API_UPSTREAM};
    proxy_pass $uploads_url;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy vers le backend (résolution dynamique — ne bloque pas au démarrage)
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend_url ${API_UPSTREAM}/;
    proxy_pass $backend_url;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
